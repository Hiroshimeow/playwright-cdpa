[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playwright-api"
version = "0.1.0"
description = "Fail-closed ChatGPT Web execution core for persistent CDP Chromium"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["playwright>=1.52,<2", "portalocker>=3,<4"]

[project.scripts]
playwright-api = "playwright_api.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/playwright_api"]

[tool.hatch.build.targets.sdist]
include = ["/src/playwright_api", "/README.md", "/pyproject.toml"]
exclude = ["/.plan", "/dist", "/reference", "/tests", "**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 96
exclude = ["reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["I001"]
